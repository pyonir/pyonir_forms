<div class="form-ctrl-container">
  <label class="form-label" for="{{ form_ctrl.props.id }}">{{form_ctrl.label or ''}}</label>
  <select id="{{ form_ctrl.props.id }}" name="{{ form_ctrl.props.name }}">
      <option selected="" disabled>{{form_ctrl.label or ''}}</option>
      {% for option in form_ctrl.props.options %}
        <option>{{ option }}</option>
      {% endfor %}
  </select>
{% if form_ctrl.props.description %}
  <p class="form-help-text">{{ form_ctrl.props.description }}</p>
{% endif %}
</div>
