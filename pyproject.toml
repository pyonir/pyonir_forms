[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pyonir-forms"
version = "0.0.1"
description = "Reusable HTML form controls for Pyonir applications"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }

authors = [
    { name = "Derry Spann" }
]

dependencies = [
    "pyonir>=0.0.88"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pyonir_forms*"]